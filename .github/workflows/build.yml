name: build
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create project
        run: |
          flutter create --platforms=android --org com.example app
          cp main.dart app/lib/main.dart
          cp pubspec.yaml app/pubspec.yaml
          cp AndroidManifest.xml app/android/app/src/main/AndroidManifest.xml
          mkdir -p app/android/app/src/main/kotlin/com/example/dfsupport
          cp MainActivity.kt NotificationStore.kt DFNotificationListener.kt app/android/app/src/main/kotlin/com/example/dfsupport/
          rm -rf app/test
          rm -f app/analysis_options.yaml
      - name: Get packages
        working-directory: app
        run: flutter pub get
      - name: Analyze
        working-directory: app
        run: flutter analyze
      - name: Build APK
        working-directory: app
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DFSupport-APK
          path: app/build/app/outputs/flutter-apk/app-release.apk
